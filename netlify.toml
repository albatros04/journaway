[build]
  base = "frontend"
  # Nitro's Netlify manifest serves the generated browser assets from dist.
  # Publishing source frontend files causes CSS and JavaScript requests to fall
  # through to SSR, leaving the live site unstyled.
  publish = "dist"
  # The App Router's server routes use the shared database module in ../backend.
  # Netlify installs dependencies from the base directory only, so install the
  # backend runtime dependencies before creating the server functions.
  command = "npm ci --prefix ../backend && npm run build:netlify"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"
  # The administrator username is an identifier, not a credential. Netlify's
  # scanner can mistake a common value such as "admin" for a source leak.
  # Passwords, session secrets, database URLs, and API keys remain scanned.
  SECRETS_SCAN_OMIT_KEYS = "JOURNAWAY_ADMIN_USERNAME"
